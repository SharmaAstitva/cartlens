name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint, unit + integration tests, 90% coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cartlens
          POSTGRES_PASSWORD: cartlens
          POSTGRES_DB: cartlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cartlens"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://cartlens:cartlens@localhost:5432/cartlens_test
      PREFECT_HOME: /tmp/prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest tests/unit --cov --cov-report= --cov-fail-under=0
      - name: Integration tests (Postgres, Prefect, dbt) + coverage gate
        run: pytest tests/integration --cov --cov-append --cov-report=term-missing

  frontend:
    name: Frontend (lint, tests, 90% coverage, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit + integration tests with coverage gate
        run: npm run coverage
      - run: npm run build
      - run: npm audit --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
